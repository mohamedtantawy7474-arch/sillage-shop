<style>
/* ---------- HERO: bold and playful ----------
   A giant three-line headline (solid / outlined / bronze), a real bottle floating over it that swaps through
   the whole catalog, hand-written notes, and small labels in the corners. Script at the end of the page. */
.hero{min-height:100svh;position:relative;display:grid;place-items:center;padding:120px 16px 140px;overflow:hidden;background:var(--ink)}
.hero-title{text-align:center;font-size:clamp(54px,15.5vw,250px);letter-spacing:-.01em;position:relative;z-index:1}
html[lang=ar] .hero-title{font-size:clamp(50px,13vw,215px);letter-spacing:0}
.hero-title span{display:block}
.hero-title .outline{color:transparent;-webkit-text-stroke:2px var(--paper)}
.hero-title .accent{color:var(--gold)}
.hero-bottle{position:absolute;z-index:2;top:50%;left:50%;width:clamp(150px,17vw,270px);aspect-ratio:4/5;pointer-events:none;
  translate:calc(-50% + var(--px,0px)) calc(-48% + var(--py,0px));transition:translate .5s var(--ease)}
.hero-bottle .bob{position:absolute;inset:0;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(5deg)}}
.hero-bottle img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  opacity:0;transform:translateY(22px) scale(.92) rotate(-6deg);transition:opacity .7s var(--ease),transform .9s var(--ease);
  filter:drop-shadow(0 26px 28px rgba(70,45,15,.32))}
.hero-bottle img.on{opacity:1;transform:none}
.scribble{position:absolute;z-index:3;font-family:var(--hand);color:var(--gold);font-size:clamp(19px,2.1vw,30px);line-height:1.2;transform:rotate(-8deg)}
html[lang=ar] .scribble{font-size:clamp(21px,2.3vw,33px)}
.scribble.s1{bottom:27%;inset-inline-end:7%;transform:rotate(-6deg)}
.scribble.s1 svg{transform:scaleY(-1)} [dir=rtl] .scribble.s1 svg{transform:scale(-1,-1)}
.scribble.s2{bottom:24%;inset-inline-start:7%;transform:rotate(6deg)}
.scribble svg{display:block;width:90px;margin-top:4px}
[dir=rtl] .scribble svg{transform:scaleX(-1)}
.now{position:absolute;z-index:3;bottom:82px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;
  max-width:calc(100% - 32px);padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(244,239,230,.82);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--muted);white-space:nowrap;transition:border-color .3s}
.now:hover,.now:focus-visible{border-color:var(--gold)}
.now .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.now b{color:var(--paper);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.now .from{color:var(--gold)}
.hero-meta{position:absolute;bottom:24px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:end;color:var(--muted);z-index:3}
.hero-meta .scroll{display:flex;gap:8px;align-items:center}
.hero-meta .scroll i{width:1px;height:40px;background:var(--gold);animation:drip 1.8s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (max-width:640px){
  .hero{padding-bottom:150px}
  .scribble.s1{top:96px;bottom:auto;inset-inline-end:5%}
  .scribble.s1 svg{transform:none} [dir=rtl] .scribble.s1 svg{transform:scaleX(-1)}
  .scribble.s2{bottom:25%;inset-inline-start:5%}
  .scribble svg{width:64px}
  .now{bottom:76px}
  .now .house{display:none}
  .hero-meta .side{display:none}
  .hero-meta{justify-content:center}
}

/* ---------- PROMISE STRIP: the tilted gold band, static, every point visible at once ---------- */
/* the tilted band is wider than the screen on purpose; this wrapper trims it, so it can never widen the page (in RTL it otherwise did) */
.strip-wrap{overflow:hidden;padding:12px 0;margin:28px 0}
.strip{background:var(--gold);color:var(--ink);padding:18px 24px;transform:rotate(-1.5deg);margin:0 -20px;position:relative;z-index:5}
.strip-list{list-style:none;max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;row-gap:4px}
.strip li{font-family:var(--display);font-weight:var(--display-w);font-size:clamp(19px,1.85vw,28px);line-height:1.25;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center}
.strip li + li::before{content:"";width:.3em;height:.3em;margin:0 .75em;border-radius:50%;background:currentColor;opacity:.55}
/* where the strip wraps, dots would dangle at line starts: separate with space instead */
@media (max-width:1180px){.strip-list{column-gap:1.1em}.strip li + li::before{display:none}}

/* ---------- SECTIONS ---------- */
section{padding:120px 16px}
.wrap{max-width:1320px;margin:0 auto}
h2{font-family:var(--display);font-weight:var(--display-w);text-transform:uppercase;font-size:clamp(48px,8vw,128px);line-height:var(--display-lh);text-wrap:balance}
h2 em{font-style:normal;color:var(--gold)}
.head-row{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border:1px solid var(--line);border-radius:999px;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--paper)}
.chip[aria-pressed=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;perspective:1200px}
/* cards tilt toward the pointer in 3D; the bottle stage floats above the card surface */
.card{background:linear-gradient(180deg,#f9f5ee,var(--ink-2) 40%);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;position:relative;
  transform-style:preserve-3d;transition:transform .7s var(--ease),border-color .3s,box-shadow .7s var(--ease)}
.card.tilting{transition:transform .12s linear,border-color .3s,box-shadow .7s var(--ease)}
.card:hover{transform:translateY(-6px);border-color:rgba(139,94,52,.45);box-shadow:0 40px 60px -34px rgba(70,45,15,.3)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(139,94,52,.15),transparent 45%)}
.card:hover::after{opacity:1}
.stage{aspect-ratio:1/1;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:18px;transition:transform .7s var(--ease);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%)}

.stage .vial{width:28%;transition:transform .6s var(--ease)}
.card:hover .vial{transform:rotate(-10deg) scale(1.06)}
/* studio backdrop: warm ivory, faintly tinted with the scent's own colour; white photo backgrounds melt into it */
.stage.photo{background:radial-gradient(circle at 50% 38%,#ffffff 0%,color-mix(in srgb,var(--tint) 14%,#f1eadd) 100%)}
.stage.photo img{width:88%;height:92%;object-fit:contain;filter:drop-shadow(0 16px 14px rgba(70,45,15,.22));transition:transform .8s var(--ease)}
/* the photo lifts off the card only while a mouse hovers it; at rest (and on touch) it sits flush */
@media (hover:hover) and (pointer:fine){.card:hover .stage{transform:translateZ(30px)}}
.card:hover .stage.photo img{transform:scale(1.06) translateY(-2%)}
.stage.photo::after{background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);mix-blend-mode:soft-light}
.tag{position:absolute;top:12px;inset-inline-start:12px;z-index:1;background:rgba(244,239,230,.88);backdrop-filter:blur(6px);color:var(--gold);padding:6px 10px;border-radius:999px;border:1px solid rgba(139,94,52,.35)}
.house{color:var(--muted);font-size:11px}
.card h3{font-family:'Anton',sans-serif;font-weight:400;font-size:32px;text-transform:uppercase;line-height:1;margin:6px 0 8px}
.card .notes{font-size:15px;color:var(--muted);margin-bottom:18px;min-height:44px}
.sizes{display:flex;gap:6px;margin-bottom:14px}
.size{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;transition:border-color .15s,color .15s,background .15s}
.size:hover{border-color:var(--paper)}
.size[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:rgba(139,94,52,.06)}
.buy{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.price{font-family:var(--display);font-weight:var(--display-w);font-size:28px;white-space:nowrap;font-variant-numeric:tabular-nums}
.add{background:var(--paper);color:var(--ink);font-weight:500;padding:12px 18px;border-radius:999px;transition:background .2s;white-space:nowrap}
.add:hover,.add.done{background:var(--gold)}

/* how */
.how{background:var(--paper);color:var(--ink);border-radius:40px 40px 0 0;margin-top:40px}
.how h2 em{color:var(--ink);background:var(--gold);padding:0 .1em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:64px;border-top:2px solid var(--ink)}
.step{padding:32px 24px;padding-inline-start:0;border-inline-end:1px solid rgba(244,239,230,.16)}
.step:last-child{border-inline-end:0}
.step .n{font-family:'Anton',sans-serif;font-size:96px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--ink)}
.step h3{font-family:var(--display);font-weight:var(--display-w);text-transform:uppercase;font-size:28px;line-height:1.15;margin:12px 0 10px}
.step p{font-size:16px;line-height:1.6;max-width:34ch;color:rgba(244,239,230,.74)}

/* set */
.set{background:var(--paper);color:var(--ink);padding-top:0}
.set-card{background:var(--ink);color:var(--paper);border-radius:32px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.set-card::after{content:"";position:absolute;inset-inline-end:-10%;bottom:-40%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(139,94,52,.25),transparent 65%)}
.set-card p{color:var(--muted);font-size:17px;line-height:1.65;max-width:44ch;margin:20px 0 28px}
.set-price{display:flex;align-items:baseline;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.set-price b{font-family:var(--display);font-weight:var(--display-w);font-size:56px;color:var(--gold);line-height:1.1}
.set-price s{color:var(--muted)}
.vials-row{display:flex;justify-content:center;align-items:end;gap:clamp(6px,1.4vw,18px);position:relative;z-index:2}
.vials-row svg{width:clamp(30px,5vw,64px);transition:transform .5s var(--ease)}
.vials-row svg:nth-child(odd){transform:translateY(-16px)}
.set-card:hover .vials-row svg{transform:translateY(-24px) rotate(-4deg)}
.scrawl{font-family:var(--hand);color:var(--gold);font-size:24px;position:absolute;top:28px;inset-inline-end:36px;transform:rotate(6deg);z-index:2}

/* faq */
.faq-list{border-top:1px solid var(--line);margin-top:48px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 0;font-family:var(--display);font-weight:var(--display-w);text-transform:uppercase;font-size:clamp(22px,3vw,38px);line-height:1.2}
summary::-webkit-details-marker{display:none}
summary svg{flex:none;color:var(--gold);transition:transform .3s var(--ease)}
details[open] summary svg{transform:rotate(45deg)}
details p{color:var(--muted);font-size:17px;line-height:1.65;max-width:68ch;padding-bottom:28px}

/* footer */
footer.site{padding:80px 16px 24px;border-top:1px solid var(--line)}
.foot-top{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;margin-bottom:80px}
.foot-top h5{color:var(--muted);margin-bottom:16px;font-weight:400}
.foot-top p{max-width:36ch;color:var(--muted);line-height:1.6}
.foot-top a{display:block;padding:4px 0}
.foot-top a:hover{color:var(--gold)}
.wordmark{font-family:'Anton',sans-serif;font-size:clamp(80px,23vw,400px);line-height:.8;text-align:center;color:var(--gold);user-select:none;direction:ltr}
.legal{display:flex;justify-content:space-between;color:var(--muted);margin-top:24px;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  .set-card{grid-template-columns:1fr}
  .foot-top{grid-template-columns:1fr 1fr}
  .foot-top > div:first-child{grid-column:1/-1}
  .step{border-inline-end:0;border-bottom:1px solid rgba(244,239,230,.16)}
}
</style>
</head>
<body>

<nav class="nav" aria-label="Main">
  <a href="#" class="logo"><i></i>SILLAGE</a>
  <ul class="label">
    <li><a href="#shop" data-i18n="navShop"></a></li>
    <li><a href="#how" data-i18n="navHow"></a></li>

  </ul>
  <div class="nav-end">

    <button class="pill label" id="openCart"><span data-i18n="bag"></span> <b id="count">0</b></button>
  </div>
</nav>

<header class="hero" id="hero">
  <h1 class="hero-title display">
    <span data-i18n="heroA"></span>
    <span class="outline" data-i18n="heroB"></span>
    <span class="accent" data-i18n="heroC"></span>
  </h1>
  <div class="hero-bottle" id="heroBottle" aria-hidden="true"></div>
  <div class="scribble s1"><span data-i18n-html="scribble1"></span>
    <svg viewBox="0 0 90 30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M85 4 C 60 20, 30 26, 6 18"/><path d="M14 10 L5 18 L15 24"/></svg>
  </div>
  <div class="scribble s2" data-i18n-html="scribble2"></div>
  <a class="now label" id="heroNow" href="#shop"></a>
  <div class="hero-meta label">
    <span class="side" data-i18n="metaLeft"></span>
    <span class="scroll"><i></i><span data-i18n="metaScroll"></span></span>
    <span class="side" data-i18n="metaRight"></span>
  </div>
</header>

<div class="strip-wrap"><div class="strip"><ul class="strip-list" id="marq"></ul></div></div>

<!-- Scent carousel: built by orbit.js from products.js; removes itself if GSAP can't load -->
<section id="tour" class="orb-sec"></section>

<section id="shop">
  <div class="wrap">
    <div class="head-row">
      <h2 data-i18n-html="shopTitle"></h2>
      <div class="filters label" id="filters" role="group">
        <button class="chip" data-f="all" aria-pressed="true" data-i18n="fam_all"></button>
        <button class="chip" data-f="fresh" aria-pressed="false" data-i18n="fam_fresh"></button>
        <button class="chip" data-f="woody" aria-pressed="false" data-i18n="fam_woody"></button>
        <button class="chip" data-f="sweet" aria-pressed="false" data-i18n="fam_sweet"></button>
        <button class="chip" data-f="spicy" aria-pressed="false" data-i18n="fam_spicy"></button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="how" id="how">
  <div class="wrap">
    <h2 data-i18n-html="howTitle"></h2>
    <div class="steps">
      <div class="step"><div class="n">01</div><h3 data-i18n="s1t"></h3><p data-i18n="s1b"></p></div>
      <div class="step"><div class="n">02</div><h3 data-i18n="s2t"></h3><p data-i18n="s2b"></p></div>
      <div class="step"><div class="n">03</div><h3 data-i18n="s3t"></h3><p data-i18n="s3b"></p></div>
      <div class="step"><div class="n">04</div><h3 data-i18n="s4t"></h3><p data-i18n="s4b"></p></div>
    </div>
  </div>
</section>

<section class="set" id="set">
  <div class="wrap">
    <div class="set-card">
      <span class="scrawl" data-i18n="setScrawl"></span>
      <div>
        <h2 data-i18n-html="setTitle"></h2>
        <p data-i18n="setBody"></p>
        <div class="set-price"><b id="setPrice"></b><s class="label" id="setWas"></s></div>
        <button class="big-btn label" id="addSet"><span data-i18n="setAdd"></span></button>
      </div>
      <div class="vials-row" id="setVials"></div>
    </div>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <h2 data-i18n-html="faqTitle"></h2>
    <div class="faq-list" id="faqList"></div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <div class="foot-top">
      <div><p data-i18n="footTag"></p></div>
      <div><h5 class="label" data-i18n="footShop"></h5><a href="#shop" data-i18n="footAll"></a><a href="#set" data-i18n="footSet"></a></div>
      <div><h5 class="label" data-i18n="footInfo"></h5><a href="#how" data-i18n="footHow"></a><a href="#faq" data-i18n="footFaq"></a></div>
    </div>
    <div class="wordmark" aria-hidden="true">SILLAGE</div>
    <div class="legal label"><span>© 2026 Sillage</span><span data-i18n="legal"></span></div>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Bag" aria-hidden="true" inert>
  <header><h3 class="display" data-i18n="bagTitle"></h3><button class="close label" id="closeCart"><span data-i18n="close"></span></button></header>
  <div class="items" id="items"></div>

    <div class="ship-bar label" id="shipTxt"></div>
    <div class="bar"><i id="shipBar"></i></div>
    <div class="total"><span class="label" data-i18n="subtotal"></span><b id="total"></b></div>
    <a class="big-btn label" id="checkout" href="checkout.html"><span data-i18n="checkout"></span></a>
    <p class="note label" data-i18n="bagNote"></p>
  </footer>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const P = CATALOG.products, FREE = CATALOG.freeDeliveryOver;
const sel = {};          // chosen size index per product
let filter = 'all';
let cart = cleanCart(loadCart());

// icons that sit beside translated text
document.getElementById('addSet').insertAdjacentHTML('beforeend', ICON.arrow);
document.getElementById('checkout').insertAdjacentHTML('beforeend', ICON.arrow);
document.getElementById('closeCart').insertAdjacentHTML('beforeend', ICON.close);

function drawStatic() {
  const words = t('marquee', {}).map(w => w.replace('{free}', money(FREE)));
  document.getElementById('marq').innerHTML = words.map(w => `<li>${w}</li>`).join('');
  const s = CATALOG.set, sep = P.reduce((a, p) => a + p.price[0], 0);
  document.getElementById('setPrice').textContent = money(s.price);
  document.getElementById('setWas').textContent = t('setWas', { n: money(sep) });
  document.getElementById('setVials').innerHTML = P.map(p => vial(p.c[1])).join('');
  document.getElementById('faqList').innerHTML = [1, 2, 3, 4].map(i => `
    <details><summary>${t('q' + i)}<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></summary>
    <p>${t('a' + i, { fee: money(CATALOG.deliveryFee), free: money(FREE) })}</p></details>`).join('');
}

function drawGrid() {
  document.getElementById('grid').innerHTML = P.filter(p => filter === 'all' || p.fam === filter).map(p => {
    const s = sel[p.id] ?? 1;
    return `<article class="card" id="p-${p.id}" data-id="${p.id}">
      <div class="stage photo" style="--tint:${p.c[1]}">
        ${p.tag ? `<span class="tag label">${t('tag_' + p.tag)}</span>` : ''}<img src="${p.img}" alt="${p.house} ${p.name}" loading="lazy" decoding="async">
      </div>
      <div class="house label" lang="en">${p.house}</div>
      <h3 lang="en">${p.name}</h3>
      <p class="notes">${p.notes[LANG] || p.notes.en}</p>
      <div class="sizes label" role="group">${CATALOG.sizes.map((z, i) =>
        `<button class="size" data-i="${i}" aria-pressed="${i === s}">${t('ml', { n: num(z) })}</button>`).join('')}</div>
      <div class="buy"><span class="price">${money(p.price[s])}</span><button class="add label">${t('add')}</button></div>
    </article>`;
  }).join('');
}

document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const p = P.find(x => x.id === card.dataset.id);
  const size = e.target.closest('.size'), add = e.target.closest('.add');
  if (size) {
    sel[p.id] = +size.dataset.i;
    card.querySelectorAll('.size').forEach(b => b.setAttribute('aria-pressed', b === size));
    card.querySelector('.price').textContent = money(p.price[sel[p.id]]);
  }
  if (add) {
    addToBag(`${p.id}-${sel[p.id] ?? 1}`);
    add.textContent = t('added'); add.classList.add('done');
    setTimeout(() => { add.textContent = t('add'); add.classList.remove('done'); }, 1400);
  }
});

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  filter = chip.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
  drawGrid();
});

document.getElementById('addSet').onclick = () => addToBag('set');

function addToBag(key) {
  const ex = cart.find(c => c.key === key);
  ex ? ex.qty++ : cart.push({ key, qty: 1 });
  saveCart(cart); drawBag();
  const info = lineInfo(key);
  toast(t('addedToast', { name: `${info.name} (${info.size})` }));
}

function drawBag() {
  const lines = cart.map(c => ({ ...c, ...lineInfo(c.key) }));
  const n = lines.reduce((a, c) => a + c.qty, 0), sub = lines.reduce((a, c) => a + c.qty * c.price, 0);
  document.getElementById('count').textContent = num(n);
  document.getElementById('total').textContent = money(sub);
  document.getElementById('shipBar').style.width = Math.min(100, sub / FREE * 100) + '%';
  document.getElementById('shipTxt').textContent = sub >= FREE ? t('freeOn') : t('toFree', { n: money(FREE - sub) });
  const co = document.getElementById('checkout');
  co.toggleAttribute('aria-disabled', !lines.length);
  co.style.pointerEvents = lines.length ? '' : 'none';
  co.style.opacity = lines.length ? '' : '.45';
  document.getElementById('items').innerHTML = lines.length ? lines.map((c, i) => `
    <div class="item">${thumb(c)}
      <div><h6>${c.name}</h6><small class="label">${c.size}</small>
        <div class="qty label"><button data-i="${i}" data-d="-1" aria-label="−">${ICON.minus}</button>${num(c.qty)}<button data-i="${i}" data-d="1" aria-label="+">${ICON.plus}</button></div></div>
      <span class="p">${money(c.price * c.qty)}</span></div>`).join('')
    : `<div class="empty"><b>${t('emptyHand')}</b>${t('emptyBody')}</div>`;
}

document.getElementById('items').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const c = cart[b.dataset.i]; c.qty += +b.dataset.d;
  if (c.qty < 1) cart.splice(b.dataset.i, 1);
  saveCart(cart); drawBag();
});

const drawer = document.getElementById('drawer');
// the closed bag is inert, so keyboard focus can't wander into it; closing returns focus to the Bag button
const openC = () => { document.body.classList.add('cart-open'); drawer.inert = false; drawer.setAttribute('aria-hidden', 'false'); document.getElementById('closeCart').focus(); };
const closeC = () => {
  if (!document.body.classList.contains('cart-open')) return;
  const hadFocus = drawer.contains(document.activeElement);
  document.body.classList.remove('cart-open'); drawer.inert = true; drawer.setAttribute('aria-hidden', 'true');
  if (hadFocus) document.getElementById('openCart').focus();
};
document.getElementById('openCart').onclick = openC;
document.getElementById('closeCart').onclick = closeC;
document.getElementById('scrim').onclick = closeC;
addEventListener('keydown', e => e.key === 'Escape' && closeC());

function drawAll() { drawStatic(); drawGrid(); drawBag(); }
document.addEventListener('langchange', drawAll);
document.addEventListener('DOMContentLoaded', () => {
  drawAll();
  // ?bag opens the bag (from checkout's "Edit bag"); ?payfailed is where Paymob sends failed payments.
  const q = new URLSearchParams(location.search);
  if (q.has('bag') || q.has('payfailed')) {
    history.replaceState(null, '', location.pathname);
    openC();
    if (q.has('payfailed')) toast(t('payFailed'));
  }
});

// product cards tilt toward the pointer (mouse/trackpad only, and not when reduced motion is on)
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const grid = document.getElementById('grid');
  grid.addEventListener('pointermove', e => {
    const card = e.target.closest('.card'); if (!card) return;
    if (e.target.closest('button')) return;   // hold the tilt still over buttons, so they never slide away mid-click
    const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.classList.add('tilting');
    card.style.transform = `translateY(-6px) rotateX(${(.5 - y) * 9}deg) rotateY(${(x - .5) * 11}deg)`;
    card.style.setProperty('--mx', x * 100 + '%');
    card.style.setProperty('--my', y * 100 + '%');
  });
  grid.addEventListener('pointerout', e => {
    const card = e.target.closest('.card');
    if (card && !card.contains(e.relatedTarget)) { card.classList.remove('tilting'); card.style.transform = ''; }
  });
}

// Hero bottle: a real bottle floats over the headline and swaps to the next scent every few seconds; the small
// link under it names that scent and jumps to its card. It pauses while hovered or focused, when the hero is off
// screen or the tab hidden, and with reduced motion (which also stops the bob and the pointer drift).
(() => {
  const box = document.getElementById('heroBottle'), now = document.getElementById('heroNow'), hero = document.getElementById('hero');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  box.innerHTML = '<div class="bob">' + P.map(p => `<img src="${p.img}" alt="" decoding="async">`).join('') + '</div>';
  const imgs = [...box.querySelectorAll('img')];
  let i = Math.max(0, P.findIndex(p => p.id === 'liquidbrun')), held = false, onScreen = true;
  const label = () => {
    const p = P[i];
    now.href = '#p-' + p.id;
    now.innerHTML = `<span class="dot"></span><b lang="en"><span class="house">${p.house} </span>${p.name}</b><span class="from">${t('fromPrice', { n: money(p.price[0]) })}</span>`;
  };
  const show = n => { imgs[i].classList.remove('on'); i = (n + P.length) % P.length; imgs[i].classList.add('on'); label(); };
  imgs[i].classList.add('on'); label();
  setInterval(() => { if (!held && onScreen && !document.hidden && !still.matches) show(i + 1); }, 3200);
  ['mouseenter', 'focus'].forEach(ev => now.addEventListener(ev, () => { held = true; }));
  ['mouseleave', 'blur'].forEach(ev => now.addEventListener(ev, () => { held = false; }));
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; }).observe(hero);
  document.addEventListener('langchange', label);
  const bob = box.querySelector('.bob');
  const calm = () => { bob.style.animation = still.matches ? 'none' : ''; };
  still.addEventListener?.('change', calm); calm();
  addEventListener('pointermove', e => {
    if (scrollY > innerHeight || still.matches) return;
    box.style.setProperty('--px', ((e.clientX / innerWidth - .5) * 30).toFixed(1) + 'px');
    box.style.setProperty('--py', ((e.clientY / innerHeight - .5) * 20).toFixed(1) + 'px');
  });
})();
</script>
